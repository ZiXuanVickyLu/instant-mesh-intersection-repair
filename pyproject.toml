[tool.poetry]
name = "instant-mesh-repair"
version = "0.1.0"
description = "Instant Self-Intersection Repair for 3D Meshes"
authors = ["Wonjong Jang"]
readme = "README.md"
packages = [
    {include = "configs"},
    {include = "constraints"},
    {include = "energies"},
    {include = "largesteps"},
    {include = "mutils"},
    {include = "optimizers"},
    {include = "repair_factory.py"},
]

[tool.poetry.dependencies]
python = "^3.11"

# PyTorch with CUDA 12.6 support
torch = {version = "^2.7.1", source = "pytorch"}
torchvision = {version = "^0.22.1", source = "pytorch"}
torchaudio = {version = "^2.7.1", source = "pytorch", optional = true}
numpy = ">=1.24.0"
scipy = ">=1.11.0"
PyYAML = ">=6.0"
potpourri3d = ">=1.3"
cholespy = ">=1.0.0"
toml = "^0.10.2"
tqdm = "^4.66.0"
trimesh = "^4.0.0"
rtree = ">=1.0.0"
open3d = "^0.18.0"
warp-lang = ">=1.12.0"

# Optional: only needed for --vis mode
polyscope = {version = ">=2.1.0", optional = true}

[tool.poetry.extras]
vis = ["polyscope"]

[tool.poetry.scripts]
mesh-repair = "repair_factory:cli"

[tool.poetry.group.dev.dependencies]
polyscope = ">=2.1.0"

[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu126"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
